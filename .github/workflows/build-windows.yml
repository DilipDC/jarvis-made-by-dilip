name: Build Windows JARVIS installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip pyinstaller
      - run: python -m pip install -e .
      - run: pyinstaller --noconfirm --clean --onefile --name JARVIS launcher.py
      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/JARVIS.iss
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows
          path: installer/dist/JARVIS-Setup.exe
