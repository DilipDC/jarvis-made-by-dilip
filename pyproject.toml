[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="jarvis-made-by-dilip"
version="1.0.0"
description="JARVIS — BUILT BY DILIP: lightweight local-first multi-agent AI operating layer"
requires-python=">=3.10"
dependencies=["fastapi>=0.129,<0.130","uvicorn[standard]>=0.35,<1","httpx>=0.27,<1","psutil>=6,<8","pydantic>=2,<3","pypdf>=5,<7","python-dotenv>=1,<2","PyYAML>=6,<7"]

[project.optional-dependencies]
airllm=["airllm>=4,<5"]
voice=["SpeechRecognition>=3.10,<4","pyttsx3>=2.90,<3"]
browser=["playwright>=1.59,<2"]
mcp=["mcp>=2,<3"]
computer=["pyautogui>=0.9,<1"]
rag=["sentence-transformers>=4,<6"]
test=["pytest>=8,<9"]

[project.scripts]
jarvis="jarvis_app.cli:main"

[tool.pytest.ini_options]
pythonpath=["."]
